write_digest_task:
  description: >
    Review the fetched paragliding news entries provided below:
    
    "{news_data}"

    Analyze, filter duplicates, and write a professional, beautifully formatted Markdown daily digest titled "🪂 Paragliding Daily Digest".
    Organize the report into 4 clear sections:
    1. ⚙️ Gear & Equipment Releases (Gliders, Harnesses, Instruments, Parakites)
    2. 🏆 Competitions & World Records (PWC, CIVL, X-Alps, Regional events)
    3. 🛡️ Flight Safety & Community Advisories (Safety notices, airspace updates)
    4. 🌄 XC & Vol-Bivouac Expeditions
    
    Include an engaging Editor's Note at the start summarizing current free-flight trends.
  expected_output: >
    A complete, publication-ready Markdown digest report saved to outputs/paragliding_digest.md.
  agent: digest_editor
